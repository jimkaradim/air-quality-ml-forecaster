name: Real-data training and evaluation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/train-evaluate.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verify tests before fitting the model
        run: python -m pytest -q
      - name: Download real UCI dataset
        run: python scripts/download_data.py
      - name: Fit and evaluate chronological hold-out model
        run: python train.py
      - name: Create metrics and chart from real held-out observations
        run: python scripts/render_results.py
      - name: Store evaluation as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-uci-evaluation
          path: |
            results/EVALUATION.md
            results/metrics.json
            results/test_forecast_window.png
          if-no-files-found: error
      - name: Publish measured evaluation to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/EVALUATION.md results/metrics.json results/test_forecast_window.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish measured evaluation on original UCI Beijing PM2.5 dataset"
            # Another commit may have landed while training; preserve it safely.
            git pull --rebase origin main
            git push origin main
          else
            echo "Existing results are current"
          fi
